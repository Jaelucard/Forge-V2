[package]
name = "forge-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
forge-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
leptos = { version = "=0.8.23", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Node", "NodeList", "HtmlElement", "KeyboardEvent", "HtmlTextAreaElement", "HtmlInputElement", "Event", "EventTarget"] }
console_error_panic_hook = "0.1"
futures = "0.3"
